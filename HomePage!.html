<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Webpage</title>
    <style>
        body {
            /* Replace with your image file path or internet URL */
            background-image: url('Halloween_GIF_Tree.gif');

            /* Prevents the image from repeating like a grid */
            background-repeat: no-repeat;

            /* Centers the image on the screen */
            background-position: center;

            /* Scales the image to completely fill the screen */
            background-size: cover;

            /* Keeps the background fixed in place while scrolling */
            background-attachment: fixed;

            /* Fallback color if the image fails to load */
            background-color: #cccccc;

            display: flex;
            justify-content: center;
            align-items: center;

        }
        #yesBtn{
            transform: translateY(250px);

            font-size: 20px;
            padding: 20px 20px;
            border: black;
            /*rounded edges*/
            border-radius: 10px;
            background-color: #6045a0;
            color: white;
            cursor: pointer;
            align-items:center;
            height: 10vh;
        }
        #yesBtn:hover {
            background-color: #1c0a4e;
        }
        #NoBtn{
            transform: translateY(250px);


            font-size: 20px;
            padding: 20px 20px;
            border: Black;
            /*rounded edges*/
            border-radius: 10px;
            background-color: #6045a0;
            color: white;
            cursor: pointer;
            align-items:center;
            height: 10vh;
        }
        #NoBtn:hover {
            background-color: #1c0a4e;
        }


    </style>
</head>
<body>

<button id="yesBtn" onclick="window.location.href='YesPage.html'">
    Yes
</button>


<button id="NoBtn" type="button">No</button>



</body>
</html>
